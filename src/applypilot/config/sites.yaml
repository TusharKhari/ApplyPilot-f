# ApplyPilot configuration for ATS handling and site restrictions

# ── Manual-Only ATS Domains ──────────────────────────────────────────────
# These ATS platforms have unsolvable CAPTCHAs or cannot be automated.
# Jobs routing through them are flagged as "manual" during apply.
manual_ats:
  - "ibegin.tcsapps.com"       # TCS iBegin — unsolvable CAPTCHA every time

# ── Blocked sites — too problematic for automation ───────────────────────
blocked:
  sites:
    - "glassdoor"
    - "google"
    - "accenture"
    - "AccentureCareers"
    - "Workopolis"
  url_patterns:
    - "%glassdoor%"
    - "%google.com/about/careers%"
    - "%google.jobs%"
    - "%accenture%"
    - "%workopolis.com/out%"

# ── No-signup domains — agent must NEVER create accounts on these ─────────
# Major job boards and ATS platforms where account creation is risky/pointless.
# The agent will output RESULT:FAILED:login_required instead of signing up.
no_signup_domains:
  - "linkedin.com"
  - "indeed.com"
  - "glassdoor.com"
  - "monster.com"
  - "ziprecruiter.com"
  - "dice.com"
  - "lever.co"
  - "greenhouse.io"

# ── Blocked SSO domains — cannot authenticate through these ──────────────
blocked_sso:
  - "accounts.google.com"
  - "login.microsoftonline.com"
  - "okta.com"
  - "auth0.com"
  - "sso.cisco.com"
